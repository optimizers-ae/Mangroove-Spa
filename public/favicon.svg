<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular Luxury Seal -->
  <circle cx="32" cy="32" r="30" fill="#102F27" stroke="#C6A66B" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#C6A66B" stroke-width="0.5" stroke-dasharray="1.5 1.5" opacity="0.6"/>
  
  <!-- Moroccan Arch & Lotus Petals -->
  <!-- Top central petal -->
  <path d="M32 9 C30 13 30 16 32 18 C34 16 34 13 32 9 Z" fill="#C6A66B"/>
  <!-- Angled petals -->
  <path d="M26 12 C25 15 26 18 28 20 C29 18 29 15 26 12 Z" fill="#C6A66B" opacity="0.85"/>
  <path d="M38 12 C39 15 38 18 36 20 C35 18 35 15 38 12 Z" fill="#C6A66B" opacity="0.85"/>
  <path d="M21 17 C21 20 23 22 26 23 C26 21 24 18 21 17 Z" fill="#C6A66B" opacity="0.7"/>
  <path d="M43 17 C43 20 41 22 38 23 C38 21 40 18 43 17 Z" fill="#C6A66B" opacity="0.7"/>

  <!-- Moroccan Horseshoe Arch Outline -->
  <path d="M23 44 V30 C23 24 27 21 32 21 C37 21 41 24 41 30 V44" fill="none" stroke="#C6A66B" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Mangrove Tree Canopy inside Arch -->
  <!-- Crown / Canopy -->
  <ellipse cx="32" cy="29" rx="6" ry="4.5" fill="#C6A66B" fill-opacity="0.25"/>
  <circle cx="29" cy="28" r="3.2" fill="#C6A66B" fill-opacity="0.9"/>
  <circle cx="35" cy="28" r="3.2" fill="#C6A66B" fill-opacity="0.9"/>
  <circle cx="32" cy="26" r="3.5" fill="#E0C79B"/>
  <circle cx="32" cy="30" r="3" fill="#C6A66B"/>

  <!-- Tree Trunk and Roots -->
  <path d="M32 29 V37" stroke="#102F27" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M32 37 L29 42 M32 37 L35 42 M32 36 L30 42 M32 36 L34 42" stroke="#C6A66B" stroke-width="0.9" stroke-linecap="round"/>
  
  <!-- Water Ripple / Base -->
  <path d="M25 43 Q32 41 39 43" stroke="#C6A66B" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M27 46 Q32 44.5 37 46" stroke="#C6A66B" stroke-width="0.6" stroke-linecap="round" opacity="0.75"/>
  
  <!-- Subtle M monogram / text hint -->
  <text x="32" y="53" text-anchor="middle" font-family="Cinzel, serif" font-size="5" fill="#E0C79B" letter-spacing="1">MANGROOVE</text>
  <text x="32" y="58" text-anchor="middle" font-family="Cinzel, serif" font-size="3.5" fill="#C6A66B" letter-spacing="1.5">SPA</text>
</svg>